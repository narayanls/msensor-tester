<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d5d3cf"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a9996"/>
      <stop offset="1" stop-color="#5e5c64"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
  </defs>
  <!-- sombra/lateral do mouse -->
  <rect x="34" y="12" width="60" height="106" rx="30" fill="url(#side)"/>
  <!-- corpo -->
  <rect x="34" y="10" width="60" height="102" rx="30" fill="url(#body)"/>
  <!-- divisão dos botões -->
  <path d="M64 10 V50 M34 50 H94" stroke="#c0bfbc" stroke-width="2.5" fill="none"/>
  <!-- roda de rolagem -->
  <rect x="59" y="22" width="10" height="20" rx="5" fill="#3d3846"/>
  <rect x="61.5" y="25" width="5" height="6" rx="2.5" fill="#77767b"/>
  <!-- traço do sensor / polling -->
  <polyline points="8,86 32,86 42,68 52,104 62,58 72,98 82,76 92,86 120,86"
            fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="8,86 32,86 42,68 52,104 62,58 72,98 82,76 92,86 120,86"
            fill="none" stroke="url(#trace)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="120" cy="86" r="6" fill="#1c71d8" stroke="#ffffff" stroke-width="3"/>
</svg>
